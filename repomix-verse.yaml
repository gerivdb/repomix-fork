# repomix UrbanVerse configuration v3
# PRD-007 Phase B — 190 repos, tier filter, chunking

version: "3.0"
intent_hash: 0xREPOMIX_INTENT_20260611

ecosystem:
  name: UrbanVerse
  hub_ref: gerivdb/LLM-REPO

  # Metadonnees injectees dans l'en-tete XML de chaque bundle
  xml_header:
    - strate
    - layer
    - phi_cps
    - intent_hash
    - vague_deployee
    - connectivite
    - zone

  # Mode ecosystem : bundle multi-repo
  multi_repo:
    enabled: true
    registry: data/known_repositories_190.yaml
    pack_format: xml
    include_dormant: false
    max_repos_per_pack: 50
    chunk_size_mb: 80

  # Tier configuration
  default_tier: ALL
  tiers:
    P0:
      layers: [L0, L1, L1a, L1b, L2, L2b]
      description: "Repos critiques — constitution, SOT, cognition"
    P1:
      layers: [L3, L4]
      description: "DevTools — CLI, bundler"
    P2:
      layers: [L5, L6, L7]
      description: "Applications metier"
    P3:
      layers: [L8, L9]
      description: "Domaines creatifs et archeologie"

  # Integration avec les outils ecosysteme
  integrations:
    argus:
      enabled: true
      mode: repomix
    recall_coherence:
      enabled: true
      mode: repomix
    codedb:
      enabled: true
      output_format: fluence_matrix
    llm_training:
      enabled: true
      pack_type: recall_relay

# Output
output_dir: "D:\\DO\\WEB\\TOOLS\\L4-TOOLS\\repomix\\"
metadata_injection: true
